services:
  #####################################################
  # CCM Manager Flask App
  #####################################################
  flask-app:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - ./sboms:/app/sboms
      - ./tmp:/app/tmp
    depends_on:
      - mongo
      - apiserver
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - API_SERVER_URL=http://apiserver:8080
    env_file:
      - .env
    restart: unless-stopped

  #####################################################
  # MongoDB for CCM Manager
  #####################################################
  mongo:
    image: percona/percona-server-mongodb:4.4
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /data/db && chown -R 1001:1001 /data/db &&
        exec mongod --enableEncryption --encryptionKeyFile /etc/mongo_keyfile --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo_keyfile:/etc/mongo_keyfile:ro
    user: "0:0"
    restart: unless-stopped
  #####################################################
  # Temporary MongoDB Browser UI
  #####################################################
  mongo-express:
    image: mongo-express:latest
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8082:8081"
    restart: unless-stopped

  #####################################################
  # Dependency-Track API Server
  #####################################################
  apiserver:
    image: dependencytrack/apiserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALPINE_DATABASE_MODE: "external"
      ALPINE_DATABASE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      ALPINE_DATABASE_DRIVER: "org.postgresql.Driver"
      ALPINE_DATABASE_USERNAME: "dtrack"
      ALPINE_DATABASE_PASSWORD: "dtrack"
    deploy:
      resources:
        limits:
          memory: 12288m
        reservations:
          memory: 8192m
      restart_policy:
        condition: on-failure
    ports:
      - '8081:8080'
    volumes:
      - 'dtrack-data:/data'
    restart: unless-stopped

  #####################################################
  # Dependency-Track Frontend
  #####################################################
  frontend:
    image: dependencytrack/frontend
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://localhost:8081"
    ports:
      - "8080:8080"
    restart: unless-stopped

  #####################################################
  # PostgreSQL for Dependency-Track
  #####################################################
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    restart: unless-stopped

volumes:
  mongo-data:
  dtrack-data:
  postgres-data:
